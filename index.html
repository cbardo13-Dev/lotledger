<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LotLedger</title>
<meta name="description" content="Inventory and profit for bulk resellers">
<meta name="theme-color" content="#FFC928">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LotLedger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16213A; --muted:#5A6680; --line:#D6DCE6;
  --tape:#FFC928; --tape-ink:#16213A; --gain:#1C7A4E; --loss:#B5372A; --field:#F6F8FB;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1320; --surface:#161F33; --ink:#E8ECF4; --muted:#98A4BD; --line:#27324B;
    --tape:#FFC928; --tape-ink:#16213A; --gain:#4CC38A; --loss:#F0735F; --field:#1C2640;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#161F33; --ink:#E8ECF4; --muted:#98A4BD; --line:#27324B;
  --tape:#FFC928; --tape-ink:#16213A; --gain:#4CC38A; --loss:#F0735F; --field:#1C2640;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
img,svg{max-width:100%}

.num{font-stretch:72%;font-weight:760;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:-.01em}
.mark{width:26px;height:26px;border-radius:5px;background:var(--tape);position:relative;box-shadow:inset 0 -6px 0 rgba(22,33,58,.18)}
.mark::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--bg)}
.icon{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}

main{max-width:980px;margin:0 auto;padding:6px 18px 130px}
h1{font-size:30px;line-height:1.1;font-stretch:78%;font-weight:800;margin:10px 0 4px;letter-spacing:-.01em}
h2{font-size:21px;font-stretch:82%;font-weight:750;margin:0 0 12px}
h3{font-size:16px;font-weight:700;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px;max-width:60ch}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.cols{display:grid;gap:14px}
@media (min-width:860px){.cols{grid-template-columns:1fr 1fr}}

/* hero */
.hero{padding:22px 18px 16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hero .big{font-size:clamp(52px,14vw,84px);line-height:.95;margin:6px 0 4px}
.period{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--field)}
.period button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--muted)}
.period button.on{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);margin-top:16px;border-top:1px solid var(--line)}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:12px 12px 2px 0}
.stat .v{font-size:26px;display:block}
.stat .k{font-size:13px;color:var(--muted)}

/* chart */
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:inherit;fill:var(--muted);font-size:11px}
.chart .val{fill:var(--ink);font-weight:700;font-stretch:72%;font-size:12px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .name{font-weight:650}
.list .meta{font-size:13px;color:var(--muted)}
.right{text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:6px 0}
.rowlink{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;cursor:pointer;border-radius:6px}
.rowtext{all:unset;box-sizing:border-box;display:block;min-width:0;flex:1;cursor:pointer;border-radius:6px}
.rowlink:focus-visible,.rowtext:focus-visible,.cellink:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
.rowlink .name::after,.rowtext .name::after{content:" ›";color:var(--muted);font-weight:500}
.rowlink:hover .name,.rowtext:hover .name,.cellink:hover{text-decoration:underline;text-underline-offset:3px}
.cellink{all:unset;cursor:pointer;font-weight:600;border-radius:4px}
.trend{font-size:15px;margin:4px 0 14px;max-width:60ch}
.ichart svg{display:block;width:100%;height:auto}
.ichart text{font-family:inherit;fill:var(--muted);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 14px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px dashed currentColor;vertical-align:middle;margin-right:5px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink);vertical-align:middle;margin-right:5px}

/* stock */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stockrow .left{min-width:0}
.stockrow .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:5px;background:var(--tape);color:var(--tape-ink);font-weight:700;font-stretch:80%;margin-right:6px}
.qty{font-size:22px}
.btn-sm{border:1px solid var(--ink);background:none;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:650}
.btn-sm:disabled{opacity:.35;cursor:default}

/* lot tags: the signature element */
.lots{display:grid;gap:14px}
@media (min-width:760px){.lots{grid-template-columns:1fr 1fr}}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;width:100%;display:block}
.tag-head{background:var(--tape);color:var(--tape-ink);display:flex;align-items:center;gap:10px;padding:9px 14px}
.hole{width:13px;height:13px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);flex:none}
.tag-no{font-weight:800;font-stretch:70%;font-size:19px;letter-spacing:.01em}
.tag-fund{margin-left:auto;font-size:13px;font-weight:650}
.tag-body{padding:14px}
.tag-name{font-weight:700;font-size:17px;line-height:1.25}
.tag-meta{font-size:13px;color:var(--muted);margin-top:2px}
.bar{height:10px;border-radius:5px;background:var(--field);border:1px solid var(--line);margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.bar-cap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tag-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.tag-figs .v{font-size:21px;display:block}
.tag-figs .k{font-size:12px;color:var(--muted)}

.headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.primary{background:var(--tape);color:var(--tape-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:750}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-weight:600}
.danger{background:none;border:1px solid var(--loss);color:var(--loss);border-radius:10px;padding:11px 16px;font-weight:650}

/* backer */
.ledger-table{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto}
.ledger-table th{text-align:left;font-weight:600;color:var(--muted);padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger-table td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger-table td.n,.ledger-table th.n{text-align:right}
.owed{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.owed .big{font-size:clamp(46px,12vw,72px);line-height:1}
.note{font-size:14px;color:var(--muted);max-width:62ch}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);font-weight:700}
.sellbtn{justify-self:center;background:var(--tape);color:var(--tape-ink);border:0;border-radius:18px;width:62px;height:56px;display:grid;place-items:center;font-weight:800;font-stretch:78%;font-size:15px;transform:translateY(-10px);box-shadow:0 6px 16px rgba(22,33,58,.25)}

/* sheet */
#scrim{position:fixed;inset:0;z-index:40;background:rgba(10,15,28,.5);display:flex;align-items:flex-end;justify-content:center}
#scrim[hidden]{display:none}
#sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:700px){#scrim{align-items:center}#sheet{border-radius:16px;padding:24px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 12px;font-size:14px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.preview{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 14px;font-size:14px}
.preview .line{display:flex;justify-content:space-between;padding:3px 0}
.preview .total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:15px;font-weight:700}
.preview .total .num{font-size:26px}
.actions{display:flex;gap:10px;justify-content:flex-end}
.itemrow{display:grid;grid-template-columns:1fr 64px 84px 36px;gap:6px;margin-bottom:6px;align-items:center}
.itemrow input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:9px 8px;min-height:42px;min-width:0}
.itemrow .x{border:0;background:none;color:var(--muted);font-size:20px;height:42px}
.itemhead{display:grid;grid-template-columns:1fr 64px 84px 36px;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.linkbtn{background:none;border:0;padding:6px 0;font-weight:650;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--loss);font-size:14px;min-height:20px;margin:0 0 8px}
.phase{border:1px dashed var(--line);border-radius:12px;padding:14px;margin:14px 0}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#scanner{position:fixed;inset:0;z-index:55;background:rgba(10,15,28,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#scanner[hidden]{display:none}
.scan-box{background:var(--surface);width:100%;max-width:520px;border-radius:16px;padding:18px;max-height:100%;overflow-y:auto}
.scan-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.scan-top h2{margin:0}
#reader{width:100%;min-height:200px;background:#000;border-radius:10px;overflow:hidden}
#reader video{width:100% !important;display:block}
.scan-msg{font-size:14px;color:var(--muted);margin:10px 0 14px}
.scanbig{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:15px;font-weight:750;font-size:17px;margin:6px 0 14px}
.scanbig svg{width:24px;height:24px}
.scan-edit{border:2px solid var(--tape);border-radius:12px;padding:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.with-btn{display:flex;gap:8px}
.with-btn select,.with-btn input{flex:1;min-width:0}
.with-btn button{flex:none}
.xbtn{border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px}
.demo-banner{font-size:13px;color:var(--muted);margin:4px 0 14px}

/* connection, sign-in, loading */
.gate{max-width:420px;margin:0 auto;padding:40px 18px 60px}
.gate .brand{font-size:30px;margin-bottom:6px}
.gate .mark{width:34px;height:34px}
.gate .panel{margin-top:18px}
.gate .primary{width:100%;padding:14px}
.gate .linkbtn{display:block;margin:14px auto 0}
.okmsg{color:var(--gain);font-size:14px;margin:0 0 8px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
button[disabled].primary{opacity:.55;cursor:default}
.lookup{display:flex;gap:12px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.lookup img{width:52px;height:52px;object-fit:contain;border-radius:6px;background:#fff;flex:none}
.lookup .src{font-size:12px;color:var(--muted)}
.userline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:14px}
.ro [data-write]{display:none !important}
.ro .tabs-in{grid-template-columns:repeat(4,1fr)}
body.gated .top,body.gated .tabs{display:none}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--gain);display:inline-block;margin-right:6px}
.syncdot.off{background:var(--loss)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"></span>LotLedger</div>
  <button class="icon" data-action="settings" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div></header>

<main id="main"></main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>Profit</button>
  <button class="tab" data-tab="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg>Stock</button>
  <button class="sellbtn" data-write data-action="sell" aria-label="Record a sale">Sell</button>
  <button class="tab" data-tab="lots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Lots</button>
  <button class="tab" data-tab="backer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11h6M20 8v6"/></svg>Backer</button>
</div></nav>

<div id="scrim" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="scanner" hidden><div class="scan-box" role="dialog" aria-modal="true" aria-label="Barcode scanner">
  <div class="scan-top"><h2>Scan a barcode</h2><button class="icon" data-action="scan-cancel" aria-label="Close scanner">×</button></div>
  <div id="reader"></div>
  <p class="scan-msg" id="scan-msg">Point the camera at the barcode.</p>
  <label class="field"><span>Or type the number under the barcode</span>
  <div class="with-btn"><input id="scan-manual" inputmode="numeric" autocomplete="off" placeholder="e.g. 012345678905" style="border:1px solid var(--line);background:var(--field);border-radius:10px;padding:11px 12px;min-height:44px"><button class="primary" data-action="scan-use">Use</button></div></label>
  <p class="note" style="margin:0">A Bluetooth barcode scanner works too. Tap the box above, then scan.</p>
</div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const DAY=864e5;
const CHANNELS=['TikTok Shop','Live (off-platform)','Other'];
let state, tab='home', period=30, stockFilter='instock', stockQuery='';
let sheetCh=CHANNELS[0], logType='invest', resetArmed=false, costCache=new Map();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,d=0)=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(+c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>+c/4).toString(16)));
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(Date.now());
const daysAgo=n=>iso(Date.now()-n*DAY);
const dt=s=>new Date(s+'T12:00:00').getTime();
const daysSince=s=>Math.max(0,Math.floor((Date.now()-dt(s))/DAY));
const lotNo=n=>'Lot '+String(n).padStart(3,'0');
const shortDate=s=>new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seed(){
  const rnd=mulberry32(Date.now()%100000);
  const settings=state.settings;
  const defs=[
    {name:'Sneaker cleaning kits',supplier:'CleanStep Wholesale',age:70,cost:300,ship:40,funded:'seller',items:[['Sneaker cleaning kit',50,15,.86]]},
    {name:'Retail returns pallet: small electronics',supplier:'Gulf Coast Liquidators',age:45,cost:950,ship:180,funded:'backer',items:[['Wireless earbuds',30,25,.8],['Ring light with phone clip',20,18,.75],['Bluetooth speaker',12,35,.17],['USB-C cables, 3-pack',40,9,.7]]},
    {name:'Beauty overstock case lot',supplier:'Shelfpull Beauty',age:28,cost:650,ship:60,funded:'backer',items:[['Lip gloss gift set',60,12,.62],['Hot air styling brush',25,28,.6],['Vitamin C serum',40,15,.45]]},
    {name:'Kitchen gadget closeout',supplier:'Gulf Coast Liquidators',age:12,cost:900,ship:120,funded:'backer',items:[['Mini waffle maker',24,22,.38],['Silicone utensil set',36,16,.28],['Handheld milk frother',30,14,.33]]}
  ];
  const lots=[],items=[],sales=[];
  defs.forEach((L,k)=>{
    const lot={id:uid(),no:k+1,name:L.name,supplier:L.supplier,date:daysAgo(L.age),cost:L.cost,shipIn:L.ship,funded:L.funded};
    lots.push(lot);
    L.items.forEach(([name,qty,est,frac])=>{
      const it={id:uid(),lotId:lot.id,name,qty,est,onHand:qty};
      items.push(it);
      const toSell=Math.round(qty*frac); let sold=0;
      while(sold<toSell){
        const q=Math.min(toSell-sold,rnd()<.82?1:2);
        const age=Math.floor(rnd()*Math.max(1,L.age-1));
        const r=rnd(); const channel=r<.68?CHANNELS[0]:r<.94?CHANNELS[1]:CHANNELS[2];
        const price=Math.round(est*(.85+rnd()*.3)*100)/100;
        sales.push({id:uid(),itemId:it.id,date:daysAgo(age),qty:q,price,channel,shipOut:channel===CHANNELS[0]?0:4.5,feePct:settings.fees[channel]});
        sold+=q;
      }
      it.onHand=qty-toSell;
    });
  });
  const capital=[
    {id:uid(),type:'invest',amount:3000,date:daysAgo(50),note:'Initial capital'},
    {id:uid(),type:'invest',amount:1000,date:daysAgo(14),note:'Added for kitchen closeout'},
    {id:uid(),type:'payout',amount:600,date:daysAgo(9),note:'First profit payout'}
  ];
  return {settings,lots,items,sales,capital};
}

const friendly=e=>{

  if(/JWT|session|expired/i.test(m))return 'Your sign-in expired. Sign in again.';
  return m;
};
async function busy(btn,fn){
  if(btn){if(btn.disabled)return;btn.disabled=true;btn._t=btn.textContent;btn.textContent='Saving…'}
  try{return await fn()}finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=btn._t}}
}

async function fetchAll(table){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await sb.from(table).select('*').eq('business_id',biz.id).order('created_at').order(table==='products'?'barcode':'id').range(from,from+size-1);
    if(error)throw error;
    out.push(...data); if(data.length<size)break;
  }
  return out;
}
async function loadAll(){
  const [lots,items,sales,capital,products]=await Promise.all(['lots','items','sales','capital','products'].map(fetchAll));
  state={settings:fromBiz(biz),lots:lots.map(fromLot),items:items.map(fromItem),sales:sales.map(fromSale),capital:capital.map(fromCap),products:new Map(products.map(p=>[p.barcode,p]))};
  lastLoad=Date.now();
}
async function loadShop(){
  const {data,error}=await sb.from('business_members').select('role,businesses(*)').eq('user_id',session.user.id);

  const pick=memberships.find(m=>m.businesses.id===lsGet(BIZ_KEY))||memberships.find(m=>m.role==='owner')||memberships[0];

async function doConnect(btn){
  let url=$('#c-url').value.trim().replace(/\/+$/,''), key=$('#c-key').value.trim(), err=$('#c-err');
  if(/^[a-z0-9]{20}$/.test(url))url=`https://${url}.supabase.co`;
  if(!/^https:\/\/.+/.test(url))return err.textContent='The URL should start with https:// and end in .supabase.co';
  if(!key)return err.textContent='Paste the publishable key.';
  if(/^sb_secret_/.test(key)||/service_role/.test(atobSafe(key)))return err.textContent='That is a secret key. Use the publishable (or anon) key instead.';
  await busy(btn,async()=>{
    try{
      const test=supabase.createClient(url,key,{auth:{persistSession:false}});
      const {error}=await test.from('businesses').select('id').limit(1);
      if(error&&!/permission|policy|JWT/i.test(error.message)){
        if(/relation|does not exist|schema cache/i.test(error.message))throw new Error('Connected, but the tables are missing. Run schema.sql in the Supabase SQL Editor first.');
        throw error;
      }
      lsSet(CFG_KEY,JSON.stringify({url,key})); start();
    }catch(e){err.textContent=friendly(e)}
  });
}
function atobSafe(k){try{return atob(k.split('.')[1]||'')}catch(e){return ''}}
async function doAuth(btn){
  const err=$('#a-err'); err.textContent='';
  const email=($('#a-email')||{}).value?.trim(), pw=($('#a-pw')||{}).value;
  const back=location.origin+location.pathname;
  if(authMode!=='newpw'&&!email)return err.textContent='Enter your email.';
  if(authMode!=='reset'&&(!pw||pw.length<6))return err.textContent='Password needs at least 6 characters.';
  await busy(btn,async()=>{
    try{
      if(authMode==='signin'){const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error}
      else if(authMode==='signup'){
        const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:back}});
        if(error)throw error;
        if(!data.session){authMode='signin';viewAuth('',`Almost done. Open the confirmation email sent to ${email}, then sign in here.`)}
      }
      else if(authMode==='reset'){
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back}); if(error)throw error;
        authMode='signin'; viewAuth('','Check your email for a reset link.');
      }
      else if(authMode==='newpw'){
        const {error}=await sb.auth.updateUser({password:pw}); if(error)throw error;
        authMode='signin'; toast('Password updated'); await enterApp();
      }
    }catch(e){if(err.isConnected)err.textContent=friendly(e)}
  });
}
async function enterApp(){
  $('#main').innerHTML='<div class="loading">Loading your shop…</div>';
  try{await sb.rpc('accept_invites').then(()=>{},()=>{});await loadShop();gate=false;document.body.classList.remove('gated');render()}

async function start(){
  const c=connection();
  if(!c)return viewConnect();
  if(typeof supabase==='undefined')return viewConnect("The Supabase library didn't load. Check your internet connection and reload.");
  sb=supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let entered=false;
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;
    if(ev==='PASSWORD_RECOVERY'){authMode='newpw';viewAuth();return}
    if(ev==='SIGNED_OUT'){entered=false;biz=null;state=null;authMode='signin';closeSheet();viewAuth();return}
    if(ev==='SIGNED_IN'&&s&&!entered&&authMode!=='newpw'){entered=true;setTimeout(enterApp,0)}
  });
  const {data}=await sb.auth.getSession(); session=data.session;
  if(session&&authMode!=='newpw'){if(!entered){entered=true;enterApp()}}
  else if(authMode!=='newpw')viewAuth();
}

/* ---------- barcode lookup (Edge Function) ---------- */
const lookupCache=new Map();
async function lookupBarcode(code){
  if(lookupCache.has(code))return lookupCache.get(code);
  let res=null;
  try{
    const {data,error}=await sb.functions.invoke('barcode-lookup',{body:{barcode:code}});
    if(error)throw error; res=data;
  }catch(e){res={found:false,error:true}}
  if(res&&!res.error&&!res.limited)lookupCache.set(code,res);
  return res;
}

/* cost math: each item carries a share of its lot's landed cost, weighted by expected resale value */
function computeCosts(){
  costCache=new Map();
  state.lots.forEach(l=>{
    const its=state.items.filter(i=>i.lotId===l.id);
    if(l.costMode==='item'){
      const base=its.reduce((a,i)=>a+(i.unitCost||0)*i.qty,0);
      its.forEach(i=>costCache.set(i.id,(i.unitCost||0)+(base?l.shipIn*(i.unitCost||0)/base:0)));
      return;
    }
    const tot=its.reduce((a,i)=>a+i.est*i.qty,0);
    its.forEach(i=>costCache.set(i.id,tot?(l.cost+l.shipIn)*i.est/tot:0));
  });
}
const uc=i=>costCache.get(i.id)||0;
const item=id=>state.items.find(i=>i.id===id);
const lot=id=>state.lots.find(l=>l.id===id);
function saleCalc(s){
  const it=item(s.itemId); const rev=s.price*s.qty; const fee=rev*(s.feePct||0)/100;
  const cost=(it?uc(it):0)*s.qty; return {rev,fee,cost,net:rev-fee-(s.shipOut||0)-cost};
}
function lotStats(l){
  const its=state.items.filter(i=>i.lotId===l.id);
  const ids=new Set(its.map(i=>i.id));
  const units=its.reduce((a,i)=>a+i.qty,0), left=its.reduce((a,i)=>a+i.onHand,0);
  let rev=0,recovered=0,net=0;
  state.sales.forEach(s=>{if(ids.has(s.itemId)){const c=saleCalc(s);rev+=c.rev;recovered+=c.rev-c.fee-(s.shipOut||0);net+=c.net}});
  const landed=l.cost+l.shipIn;
  return {its,units,left,sold:units-left,landed,rev,recovered,net,profit:recovered-landed,paid:landed?recovered/landed:0,age:daysSince(l.date),estLeft:its.reduce((a,i)=>a+i.onHand*i.est,0)};
}

function weekChart(){
  const W=8, now=Date.now(); const b=new Array(W).fill(0);
  state.sales.forEach(s=>{const w=Math.floor((now-dt(s.date))/(7*DAY));if(w>=0&&w<W)b[W-1-w]+=saleCalc(s).net});
  const max=Math.max(1,...b.map(Math.abs)); const w=640,h=200,pad=26,bw=w/W;
  const hasNeg=b.some(v=>v<0); const zero=hasNeg?h/2+8:h-pad;
  const scale=(hasNeg?(h/2-pad):(h-pad*2-4))/max;
  let out=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Weekly net profit for the last 8 weeks">`;
  out+=`<line x1="0" x2="${w}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>`;
  b.forEach((v,k)=>{
    const bh=Math.abs(v)*scale, x=k*bw+bw*.18, bwid=bw*.64, y=v>=0?zero-bh:zero;
    const fill=k===W-1?'var(--tape)':(v<0?'var(--loss)':'var(--ink)');
    out+=`<rect x="${x}" y="${y}" width="${bwid}" height="${Math.max(bh,1)}" rx="3" fill="${fill}"/>`;
    out+=`<text class="val" x="${x+bwid/2}" y="${v>=0?y-6:y+bh+14}" text-anchor="middle">${money(v)}</text>`;
    const lbl=k===W-1?'This week':(W-1-k)+'w ago';
    out+=`<text x="${x+bwid/2}" y="${h-6}" text-anchor="middle">${lbl}</text>`;
  });
  return out+'</svg>';
}

function openItem(id){
  computeCosts(); const i=item(id); if(!i)return; const l=lot(i.lotId); const cost=uc(i);
  const ss=state.sales.filter(s=>s.itemId===id).sort((a,b)=>dt(b.date)-dt(a.date));
  const units=ss.reduce((a,s)=>a+s.qty,0);
  let rev=0,net=0; ss.forEach(s=>{const c=saleCalc(s);rev+=c.rev;net+=c.net});
  const avg=units?rev/units:0, perUnit=units?net/units:0;
  const prices=ss.map(s=>s.price); const lo=prices.length?Math.min(...prices):0, hi=prices.length?Math.max(...prices):0;
  const now=Date.now(); const within=(a,b)=>ss.filter(s=>{const d=now-dt(s.date);return d>=a*DAY&&d<b*DAY}).reduce((x,s)=>x+s.qty,0);
  const u14=within(0,14), p14=within(14,28);
  const avgDays=units?ss.reduce((a,s)=>a+Math.max(0,(dt(s.date)-dt(l.date))/DAY)*s.qty,0)/units:0;
  let trend;
  if(!units) trend='No sales yet.';
  else{
    trend=u14>p14?`Picking up: ${u14} sold in the last 2 weeks, up from ${p14} the 2 weeks before.`
      :u14<p14?`Slowing down: ${u14} sold in the last 2 weeks, down from ${p14} the 2 weeks before.`
      :`Steady: ${u14} sold in each of the last two 2-week stretches.`;
    if(i.onHand>0&&u14>0) trend+=` At this pace the remaining ${i.onHand} sell out in about ${Math.max(1,Math.round(i.onHand/(u14/14)))} days.`;
    else if(i.onHand>0) trend+=` Nothing sold in 2 weeks, so the remaining ${i.onHand} may need a lower price or a push in a live.`;
    else trend+=' Sold out.';
  }
  const ch=new Map(); ss.forEach(s=>{const c=saleCalc(s);const a=ch.get(s.channel)||{u:0,r:0,n:0};a.u+=s.qty;a.r+=c.rev;a.n+=c.net;ch.set(s.channel,a)});

function itemChart(ss,l,cost,est,avg){
  const w=520,h=190,pl=44,pr=12,pt=12,pb=26;
  const t0=dt(l.date), t1=Math.max(Date.now(),t0+DAY);
  const ys=ss.map(s=>s.price).concat([cost,est,avg]); const ymax=Math.max(...ys)*1.1, ymin=Math.min(0,Math.min(...ys));
  const X=t=>pl+(t-t0)/(t1-t0)*(w-pl-pr), Y=v=>pt+(1-(v-ymin)/(ymax-ymin))*(h-pt-pb);
  let o=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Sale prices over time compared with cost">`;
  [0,.5,1].forEach(f=>{const v=ymin+(ymax-ymin)*f;o+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${money(v)}</text>`});
  o+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(cost)}" y2="${Y(cost)}" stroke="var(--loss)" stroke-width="2" stroke-dasharray="5 4"/>`;
  o+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6"/>`;
  ss.forEach(s=>{o+=`<circle cx="${X(dt(s.date))}" cy="${Y(s.price)}" r="${s.qty>1?6:4.5}" fill="var(--ink)" fill-opacity=".8"/>`});
  o+=`<text x="${pl}" y="${h-6}">Bought ${shortDate(l.date)}</text><text x="${w-pr}" y="${h-6}" text-anchor="end">Today</text>`;
  return o+'</svg>';
}

let scanner=null, scanCb=null, scanLot=null;
function openScanner(cb){
  scanCb=cb; $('#scanner').hidden=false; $('#scan-manual').value='';
  const msg=$('#scan-msg'), rd=$('#reader');
  const noCam=t=>{msg.textContent=t;rd.style.display='none';$('#scan-manual').focus()};
  if(typeof Html5Qrcode==='undefined'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)
    return noCam("The camera isn't available here. Type the number, or use a Bluetooth scanner.");
  rd.style.display=''; msg.textContent='Starting the camera…';
  try{
    const F=Html5QrcodeSupportedFormats;
    scanner=new Html5Qrcode('reader',{verbose:false,formatsToSupport:[F.UPC_A,F.UPC_E,F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,hh)=>({width:Math.max(60,Math.min(300,Math.floor(w*.85))),height:Math.max(60,Math.min(140,Math.floor(hh*.6)))})},c=>finishScan(c),()=>{})
      .then(()=>{if(scanner)msg.textContent='Point the camera at the barcode. It scans on its own.'})
      .catch(()=>{scanner=null;noCam("Couldn't open the camera. Allow camera access in your browser, or type the number below.")});
  }catch(e){scanner=null;noCam("Couldn't open the camera. Type the number below instead.")}
}
async function stopScanner(){if(scanner){const s=scanner;scanner=null;try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}}
async function finishScan(code){
  code=String(code||'').trim(); if(!code||!scanCb)return;
  const cb=scanCb; scanCb=null; await stopScanner(); $('#scanner').hidden=true;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  cb(code);
}
function cancelScan(){scanCb=null;stopScanner();$('#scanner').hidden=true}

async function runLookup(code){

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='scrim'){closeSheet();return}
  const el=t.closest('[data-tab],[data-period],[data-filter],[data-ch],[data-fund],[data-type],[data-action]'); if(!el)return;
  if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo(0,0);return}
  if(el.dataset.period!==undefined){period=+el.dataset.period;render();return}
  if(el.dataset.filter){stockFilter=el.dataset.filter;render();return}
  if(el.dataset.ch){sheetCh=el.dataset.ch;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));const d=$('#s-ship');if(d)sellPreview();return}
  if(el.dataset.fund||el.dataset.type){if(el.dataset.type)logType=el.dataset.type;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));return}
  switch(el.dataset.action){
    case 'sell':openSell(el.dataset.item);break;
    case 'item':openItem(el.dataset.item);break;
    case 'scan-lot':openScanLot();break;
    case 'scan-item':openScanner(onLotScan);break;
    case 'noscan-item':if(scanLot){scanLot.edit={code:'',name:'',qty:1,cost:'',est:'',known:false};renderScanLot();$('#e-name').focus()}break;
    case 'edit-discard':scanLot.edit=null;renderScanLot();break;
    case 'edit-add':commitEdit();break;
    case 'edit-add-next':if(commitEdit())openScanner(onLotScan);break;
    case 'k-rm':scanLot.items.splice(+el.dataset.i,1);renderScanLot();break;
    case 'save-scanlot':saveScanLot(el);break;
    case 'sell-scan':openScanner(onSellScan);break;
    case 'scan-cancel':cancelScan();break;
    case 'scan-use':finishScan($('#scan-manual').value);break;
    case 'close':closeSheet();break;
    case 'save-sale':saveSale(el);break;
    case 'add-lot':openAddLot();break;
    case 'add-row':$('#l-rows').insertAdjacentHTML('beforeend',itemRowHtml());$('#l-rows .itemrow:last-child input').focus();break;
    case 'rm-row':{const rows=document.querySelectorAll('#l-rows .itemrow');if(rows.length>1)el.closest('.itemrow').remove();lotPreview();break}
    case 'save-lot':saveLot(el);break;
    case 'lot':openLot(el.dataset.lot);break;
    case 'log':openLog();break;
    case 'save-log':saveLog(el);break;
    case 'settings':openSettings();break;
    case 'save-settings':saveSettings(el);break;
    case 'invite':sendInvite(el);break;
    case 'signout':sb.auth.signOut();break;
    case 'sample':loadSample(el);break;
    case 'erase':
      if(!resetArmed){resetArmed=true;el.textContent='Tap again to erase everything';return}
      eraseAll(el);break;
    case 'connect':doConnect(el);break;
    case 'disconnect':lsSet(CFG_KEY,null);location.reload();break;
    case 'auth-go':doAuth(el);break;
    case 'auth-mode':authMode=el.dataset.mode;viewAuth();break;
    case 'undo-sale':undoSale(el.dataset.sale,el);break;
    case 'del-lot':deleteLot(el.dataset.lot,el);break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#scanner').hidden){cancelScan();return} if(!$('#scrim').hidden)closeSheet()}
  if(e.key==='Enter'&&e.target.id==='scan-manual'){e.preventDefault();finishScan(e.target.value)}
  if(e.key==='Enter'&&gate&&e.target.tagName==='INPUT'){e.preventDefault();const b=$('#main [data-action=auth-go],#main [data-action=connect]');b&&b.click()}
});

document.addEventListener('change',e=>{if(e.target.id==='t-shop'){lsSet(BIZ_KEY,e.target.value);closeSheet();enterApp()}});
start();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
